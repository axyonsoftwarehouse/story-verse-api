spring:
  application:
    name: story-verse-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/storyverse}
    # O runtime nunca deve ser dono das tabelas: RLS é a última barreira.
    username: ${SPRING_DATASOURCE_USERNAME:storyverse_api}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # O rate limit persistente usa uma conexão REQUIRES_NEW além da transação de negócio.
      maximum-pool-size: ${DB_POOL_SIZE:20}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    url: ${SPRING_FLYWAY_URL:}
    user: ${SPRING_FLYWAY_USER:}
    password: ${SPRING_FLYWAY_PASSWORD:}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

app:
  rate-limit:
    # Contador no Postgres compartilhado entre instâncias; fallback local se o banco falhar.
    persistent: ${APP_RATE_LIMIT_PERSISTENT:true}
  security:
    # Falha o boot se o usuário do banco for owner/superuser/bypassrls (ver RuntimeRoleGuard).
    require-runtime-role: ${APP_REQUIRE_RUNTIME_ROLE:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://storyverse.2.29.42.104.sslip.io}
  public-url: ${APP_PUBLIC_URL:https://storyverse.2.29.42.104.sslip.io}
  # Host público da API, permitido nas capas enviadas pelo próprio app.
  public-api-url: ${APP_PUBLIC_API_URL:https://api.storyverse.2.29.42.104.sslip.io}
  community:
    # Hosts HTTPS aceitos em cover_url (além dos caminhos locais do Storage).
    cover-hosts: ${APP_COMMUNITY_COVER_HOSTS:covers.openlibrary.org,openlibrary.org,www.openlibrary.org,archive.org,www.archive.org}
  mail:
    from: ${SMTP_FROM:no-reply@storyverse.local}
    from-name: ${SMTP_FROM_NAME:Storyverse}
  auth:
    # Em produção deve ficar true; testes locais podem desligar para criar contas sem SMTP.
    require-email-confirmation: ${APP_AUTH_REQUIRE_EMAIL_CONFIRMATION:true}
    confirmation-ttl: ${APP_AUTH_CONFIRMATION_TTL:PT24H}
    reset-ttl: ${APP_AUTH_RESET_TTL:PT1H}
    # Refresh token em cookie HttpOnly. Lax serve para web/API no mesmo site; para desenvolvedor
    # cross-site (localhost -> API remota) use None (exige Secure). Nunca use None sem HTTPS.
    refresh-cookie-secure: ${APP_AUTH_REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
  storage:
    # Pasta dos arquivos (fotos, livros importados, acervo). Na VPS é o volume do stack.
    dir: ${STORAGE_DIR:/data/media}
  ai:
    # Cota diária por conta. 0 não desliga: o mínimo efetivo é 1.
    daily-message-limit: ${AI_DAILY_MESSAGE_LIMIT:50}
    # Teto global diário (todas as contas). 0 = sem modo economia.
    daily-global-limit: ${AI_DAILY_GLOBAL_LIMIT:0}
    per-minute-limit: ${AI_PER_MINUTE_LIMIT:6}
  billing:
    # Desligado no beta: o paywall só entra quando a flag estiver true.
    enabled: ${BILLING_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-id: ${STRIPE_PRICE_ID:}
    price-label: ${BILLING_PRICE_LABEL:R$ 9,90}
    trial-days: ${BILLING_TRIAL_DAYS:7}
    past-due-grace-days: ${BILLING_PAST_DUE_GRACE_DAYS:3}
  # Leitura da API REST do Sentry para GET /api/v1/admin/health. O token fica só no servidor;
  # sem token/org/projetos o endpoint responde com sentry: null.
  sentry-api:
    url: ${SENTRY_API_URL:https://sentry.io}
    token: ${SENTRY_API_TOKEN:}
    org: ${SENTRY_ORG:}
    projects: ${SENTRY_PROJECTS:}
    # Ambiente do Sentry deste painel (o mesmo SENTRY_ENVIRONMENT da instância); vazio = todos.
    environment: ${SENTRY_API_ENVIRONMENT:}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  max-request-body-size: none
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
