name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests and package
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress verify
