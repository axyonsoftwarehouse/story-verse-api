name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-audit-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STORYVERSE_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests and package
        run: |
          chmod +x ./mvnw
          PGPASSWORD=local-audit-test-only psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f src/test/resources/schema-postgres.sql
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Gerar SBOM (CycloneDX)
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          cp "$HOME/.story-verse-build/story-verse-api/bom.json" sbom-api.json

      - name: Publicar SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-api
          path: sbom-api.json

      - name: Trivy (relatório, não bloqueante)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Publicar relatório Trivy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-api
          path: trivy-api.sarif
