name: Deploy API QA (VPS)

# API do ambiente de QA: https://api.qa.storyverse.2.29.42.104.sslip.io (stack storyverse-qa na VPS,
# banco próprio, dados de teste). Push no branch `develop` (integração/próxima release) publica
# sozinho. Para testar uma branch antes do merge, escolha o ref à mão:
#   gh workflow run deploy-api-qa.yml -f ref=feat/minha-branch
# Manual: story-verse-web, docs/QA.md.
#
# O código do branch (docker build) roda no job `build`, sem a chave da VPS. Só o job `deploy`
# recebe a chave de QA (environment `qa`), e ele não faz checkout: troca a imagem na VPS e confere.
# A chave é restrita por command= e só alcança a stack de QA.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou commit para publicar no QA
        required: true
        default: develop
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: deploy-api-qa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Definir a imagem (tag qa-<sha>)
        id: image
        run: echo "image=ghcr.io/axyonsoftwarehouse/story-verse-api:qa-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build e publica a imagem (GHCR)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Instalar cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Assinar imagem (keyless)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: cosign sign --yes "$IMAGE"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: qa
    env:
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Configurar chave SSH
        env:
          QA_SSH_KEY: ${{ secrets.QA_SSH_KEY }}
          QA_KNOWN_HOSTS: ${{ secrets.QA_KNOWN_HOSTS }}
        run: |
          test -n "$QA_KNOWN_HOSTS" || { echo "Configure QA_KNOWN_HOSTS com a chave verificada da VPS"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$QA_SSH_KEY" > ~/.ssh/id_qa
          chmod 600 ~/.ssh/id_qa
          printf '%s\n' "$QA_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Atualizar a API de QA na VPS
        run: |
          # O script na VPS grava no .env o SHA da imagem, confere que o contêiner subiu com
          # exatamente esta imagem e espera o health; qualquer divergência deixa o job vermelho.
          ssh -i ~/.ssh/id_qa \
            "${{ secrets.QA_USER }}@${{ secrets.QA_HOST }}" \
            "bash /home/deploy/qa-deploy/deploy-api.sh $IMAGE ${{ github.sha }}"
