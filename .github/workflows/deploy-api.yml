name: Deploy API (VPS)

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/axyonsoftwarehouse/story-verse-api:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build e publica a imagem (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Configurar chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS" || { echo "Configure VPS_KNOWN_HOSTS com a chave verificada da VPS"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Atualizar na VPS
        run: |
          # Persiste o SHA no .env: um restart manual depois do deploy nao pode voltar para :latest.
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /home/deploy/storyverse && sed -i 's|^API_IMAGE=.*|API_IMAGE=$IMAGE|' .env && (grep -q '^SENTRY_RELEASE=' .env && sed -i 's|^SENTRY_RELEASE=.*|SENTRY_RELEASE=${{ github.sha }}|' .env || echo 'SENTRY_RELEASE=${{ github.sha }}' >> .env) && API_IMAGE='$IMAGE' docker compose config --quiet && API_IMAGE='$IMAGE' docker compose pull api && API_IMAGE='$IMAGE' docker compose up -d api && docker compose ps api"

      - name: Conferir o health da API
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'curl -fsS --retry 20 --retry-delay 3 --retry-all-errors https://api.storyverse.2.29.42.104.sslip.io/api/v1/health/ready'

      - name: Smoke test da API
        env:
          API_URL: https://api.storyverse.2.29.42.104.sslip.io
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SMOKE_EMAIL" ] || [ -z "$SMOKE_PASSWORD" ]; then
            echo "::warning::SMOKE_EMAIL/SMOKE_PASSWORD não configurados; smoke test pulado."
            exit 0
          fi
          login_payload=$(jq -n --arg email "$SMOKE_EMAIL" --arg password "$SMOKE_PASSWORD" '{email:$email,password:$password}')
          login=$(curl -fsS -X POST "$API_URL/api/v1/auth/login" -H "Content-Type: application/json" -d "$login_payload")
          token=$(printf '%s' "$login" | jq -r '.accessToken // empty')
          test -n "$token" || { echo "::error::Login do smoke não devolveu accessToken"; exit 1; }
          curl -fsS "$API_URL/api/v1/auth/me" -H "Authorization: Bearer $token" >/dev/null
          curl -fsS -X PATCH "$API_URL/api/v1/auth/profile" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"name":"Smoke Test"}' >/dev/null
          if curl -fsS "$API_URL/api/v1/ai/status" | jq -e '.live == true' >/dev/null; then
            request_id=$(openssl rand -hex 16)
            ai_payload=$(jq -n --arg id "$request_id" \
              '{system:"Smoke test.",messages:[{role:"user",content:"Responda apenas: ok"}],maxTokens:10,requestId:$id}')
            curl -fsS -X POST "$API_URL/api/v1/ai/reply" \
              -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
              -d "$ai_payload" >/dev/null || echo "::warning::Chamada de IA do smoke falhou (provedor pode estar fora)."
          else
            echo "::warning::IA não configurada; chamada de IA do smoke pulada."
          fi
          echo "Smoke test da API concluído."
